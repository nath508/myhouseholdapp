<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyHousehold — Login</title>
<style>
  :root { --bg: #061208; --card: rgba(13, 30, 19, 0.85); --text: #fff; --muted: #88a692; --green: #3ded79; --border: #1c3826; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; background: url('/static/list.jpg') no-repeat center center fixed; background-size: cover; }
  .dashboard-layout { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--bg); }
  .dashboard-layout.active { display: flex; }
  .login-box { background: var(--card); backdrop-filter: blur(10px); padding: 40px 30px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .login-box.hidden { display: none; }
  .logo { width: 70px; height: 70px; background: var(--green); color: #000; border-radius: 20px; display: grid; place-items: center; font-size: 36px; font-weight: 900; margin: 0 auto 20px; }
  h1 { margin: 0 0 5px; font-size: 24px; }
  p { color: var(--muted); margin-bottom: 30px; font-size: 14px; }
  .input-group { text-align: left; margin-bottom: 15px; }
  label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; display: block; }
  input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: var(--text); font-size: 16px; }
  input:focus { outline: none; border-color: var(--green); }
  button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--green); color: #000; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .switch { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .switch a { color: var(--green); font-weight: 700; text-decoration: none; }
  header { background: rgba(13, 30, 19, 0.9); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  .menu-panel { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 24px; }
  .category-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; }
  .tab-btn { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab-btn.active { background: var(--green); color: #000; border-color: var(--green); font-weight: 800; }
  .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-action { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-add { background: #122a1a; color: var(--green); }
  .btn-save { background: var(--green); color: #000; }
  .btn-generate { background: #e6a336; color: #000; }
  .btn-visit { background: #fff; color: #000; }
  .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
  .table-header { display: grid; grid-template-columns: 1.2fr 1.2fr 0.5fr 1fr 0.6fr; background: #122a1a; padding: 14px 16px; font-size: 11px; font-weight: 800; color: var(--green); text-transform: uppercase; gap: 12px; }
  .table-row { display: grid; grid-template-columns: 1.2fr 1.2fr 0.5fr 1fr 0.6fr; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 12px; }
  .table-row input[type="text"], .table-row input[type="number"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--text); }
  .radio-group { display: flex; gap: 8px; justify-content: center; }
  .radio-group label { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .btn-delete-row { background: rgba(255, 92, 92, 0.1); color: #ff5c5c; border: 1px solid #ff5c5c; width: 100%; height: 34px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer;}
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; }
  .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .shopping-item { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<div class="login-box {% if show_dashboard %}hidden{% endif %}">
  <div class="logo">⌂</div>
  <h1>MyHousehold</h1>
  <p>Your simple household shopping assistant.</p>
  <form action="/login" method="POST">
    <div class="input-group"><label>Email Address</label><input type="email" name="email" required placeholder="you@example.com"></div>
    <div class="input-group"><label>Password</label><input type="password" name="password" required placeholder="••••••••"></div>
    <button type="submit">Log in</button>
    <div class="switch">Don't have an account? <a href="/signup_page">Sign up</a></div>
  </form>
</div>
<div class="dashboard-layout {% if show_dashboard %}active{% endif %}">
  <header>
    <h2 style="margin:0; font-size:20px;">MyHousehold</h2>
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:36px; height:36px; background:#122a1a; color:var(--green); border-radius:50%; display:grid; place-items:center; font-weight:800;">
        {% if email %}{{ email[0]|upper }}{% else %}?{% endif %}
      </div>
      <a href="/logout" style="color:var(--muted); font-size:13px; text-decoration:none; font-weight:bold;">Log out</a>
    </div>
  </header>
  <div class="content">
    <div class="menu-panel">
      <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" onclick="filterCategory('Groceries', this)">Groceries</button>
        <button class="tab-btn" onclick="filterCategory('Cleaning supplies', this)">Cleaning Supplies</button>
        <button class="tab-btn" onclick="filterCategory('Personal care', this)">Personal Care</button>
      </div>
      <div class="action-buttons">
        <button class="btn-action btn-add" onclick="addEmptyRow()">＋ Add an item</button>
        <button class="btn-action btn-save" onclick="saveList()">Save list</button>
        <button class="btn-action btn-generate" onclick="generateShoppingList()">Generate shopping list</button>
        <button class="btn-action btn-visit" onclick="openShoppingList()">Visit shopping list</button>
      </div>
    </div>
    <div class="table-container">
      <div class="table-header"><div>Product Name</div><div>Descriptions</div><div>Qty</div><div style="text-align:center;">Avail / Not</div><div style="text-align:center;">Delete</div></div>
      <div id="tableBody"></div>
    </div>
  </div>
</div>
<div class="modal" id="shoppingModal">
  <div class="modal-content">
    <div class="modal-header"><h3 style="margin:0;">Your Shopping List</h3><button onclick="closeShoppingList()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">×</button></div>
    <div class="modal-body" id="shoppingListBody"></div>
  </div>
</div>
<script>
  {% if show_dashboard %}
  let currentCategory = 'Groceries';
  let items = [];
  let shoppingList = [];
  async function loadItems() { const res = await fetch('/api/items'); items = await res.json(); renderTable(); }
  function filterCategory(cat, btn) { currentCategory = cat; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderTable(); }
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const filtered = items.filter(i => i.category === currentCategory);
    if (filtered.length === 0) { tbody.innerHTML = `<div style="padding: 40px; text-align: center; color: #88a692;">No items yet.<br>Tap "+ Add an item" to start.</div>`; return; }
    tbody.innerHTML = filtered.map(item => `
      <div class="table-row">
        <input type="text" value="${item.name || ''}" placeholder="Product" onchange="updateItem(${item.id}, 'name', this.value)">
        <input type="text" value="${item.description || ''}" placeholder="Description" onchange="updateItem(${item.id}, 'description', this.value)">
        <input type="number" value="${item.quantity}" min="1" onchange="updateItem(${item.id}, 'quantity', this.value)">
        <div class="radio-group">
          <label><input type="radio" name="avail_${item.id}" ${item.available ? 'checked' : ''} onchange="updateItem(${item.id}, 'available', true)"> Avail</label>
          <label><input type="radio" name="avail_${item.id}" ${!item.available ? 'checked' : ''} onchange="updateItem(${item.id}, 'available', false)"> Not</label>
        </div>
        <button class="btn-delete-row" onclick="deleteRow(${item.id})">Delete</button>
      </div>`).join('');
  }
  function updateItem(id, field, val) { const item = items.find(i => i.id === id); if (item) { if (field === 'quantity') val = Math.max(1, parseInt(val) || 1); item[field] = val; } }
  function deleteRow(id) { if(confirm('Delete this product?')) { items = items.filter(i => i.id !== id); renderTable(); } }
  function addEmptyRow() { items.unshift({ id: Date.now(), name: '', description: '', quantity: 1, available: true, category: currentCategory }); renderTable(); }
  async function saveList() { await fetch('/api/items', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(items) }); alert("List saved!"); loadItems(); }
  function generateShoppingList() { shoppingList = items.filter(i => !i.available && i.name.trim() !== ''); if(shoppingList.length === 0) { alert("No items marked as 'Not'."); return; } alert("Generated!"); }
  function openShoppingList() {
    const body = document.getElementById('shoppingListBody');
    if(shoppingList.length === 0) { body.innerHTML = `<p style="text-align:center; color:#88a692;">No list generated yet.</p>`; }
    else { body.innerHTML = shoppingList.map(i => `<div class="shopping-item"><div><div style="font-weight:bold;">${i.name}</div><div style="font-size:12px; color:#88a692;">${i.description || 'No description'}</div></div><div style="background:#122a1a; color:#3ded79; padding:5px 10px; border-radius:8px; font-weight:bold;">x${i.quantity}</div></div>`).join(''); }
    document.getElementById('shoppingModal').classList.add('active');
  }
  function closeShoppingList() { document.getElementById('shoppingModal').classList.remove('active'); }
  loadItems();
  {% endif %}
</script>
</body>
</html>
