<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyHousehold — Dashboard</title>
<style>
  :root { 
    --bg: #061208; --card: #0d1e13; --input: #122a1a; 
    --text: #fff; --muted: #88a692; --green: #3ded79; --border: #1c3826; 
    --red: #ff5c5c; --orange: #e6a336;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  button, input { font-family: inherit; }

  /* --- SCREENS --- */
  .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--bg); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 10; }
  .screen.hidden { transform: translateX(100%); pointer-events: none; }

  /* --- LOGIN SCREEN --- */
  #loginScreen { justify-content: center; align-items: center; padding: 24px; text-align: center; background: url('/static/list.jpg') no-repeat center center fixed; background-size: cover; }
  .login-box { background: rgba(13, 30, 19, 0.85); backdrop-filter: blur(10px); padding: 40px 30px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .logo { width: 70px; height: 70px; background: var(--green); color: #000; border-radius: 20px; display: grid; place-items: center; font-size: 36px; font-weight: 900; margin: 0 auto 20px; }
  .login-box h1 { margin: 0 0 5px; font-size: 24px; }
  .login-box p { color: var(--muted); margin-bottom: 30px; font-size: 14px; }
  .input-group { text-align: left; margin-bottom: 15px; }
  .input-group label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; display: block; }
  .input-group input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: var(--text); font-size: 16px; }
  .input-group input:focus { outline: none; border-color: var(--green); }
  .btn-login { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--green); color: #000; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .switch { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .switch a { color: var(--green); font-weight: 700; text-decoration: none; }

  /* --- DASHBOARD HEADER --- */
  header { background: var(--card); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .avatar { width: 36px; height: 36px; background: var(--input); color: var(--green); border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 1px solid var(--border); }
  .logout { color: var(--muted); font-size: 13px; text-decoration: none; font-weight: bold; }

  /* --- MAIN CONTENT --- */
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  .menu-panel { background: var(--card); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 24px; }
  .category-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; scrollbar-width: none; }
  .category-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab-btn.active { background: var(--green); color: #000; border-color: var(--green); font-weight: 800; }
  
  .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-action { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-add { background: var(--input); color: var(--green); }
  .btn-save { background: var(--green); color: #000; }
  .btn-generate { background: var(--orange); color: #000; }
  .btn-visit { background: #fff; color: #000; }

  /* --- DASHBOARD TABLE (Horizontal) --- */
  .table-container { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
  .table-header { display: grid; grid-template-columns: 2fr 3fr 1fr 2fr 1.5fr; background: var(--input); padding: 14px 16px; font-size: 10px; font-weight: 800; color: var(--green); text-transform: uppercase; gap: 8px; }
  .table-row { display: grid; grid-template-columns: 2fr 3fr 1fr 2fr 1.5fr; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 8px; }
  .table-row input[type="text"], .table-row input[type="number"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); }
  .radio-group { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .radio-group label { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .radio-group input[type="radio"] { accent-color: var(--green); width: 14px; height: 14px; }
  .btn-delete-row { background: rgba(255, 92, 92, 0.1); color: var(--red); border: 1px solid var(--red); width: 100%; height: 32px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }

  /* --- SHOPPING LIST PAGE --- */
  .shopping-header { background: var(--card); padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .btn-back { background: var(--input); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; margin-bottom: 12px; cursor: pointer;}
  .shopping-header h2 { margin: 0; font-size: 22px; }
  .shopping-page-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  
  /* BUDGET BAR */
  .budget-bar { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .budget-input-row { display: flex; align-items: center; justify-content: space-between; background: var(--input); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); }
  .budget-input-row label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .budget-input-row input { width: 100px; border: none; background: transparent; color: var(--green); font-size: 18px; font-weight: 800; text-align: right; outline: none; }
  .budget-summary { display: flex; justify-content: space-between; align-items: center; }
  .summary-box { text-align: center; }
  .summary-box span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .summary-box strong { font-size: 18px; font-weight: 800; }
  .text-green { color: var(--green); }
  .text-red { color: var(--red); }

  /* SHOPPING TABLE (Horizontal) */
  .shop-table { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
  .shop-table-header { display: grid; grid-template-columns: 2fr 1fr 1fr; background: var(--input); padding: 12px 16px; font-size: 10px; font-weight: 800; color: var(--green); text-transform: uppercase; gap: 8px; }
  .shop-table-row { display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 8px; transition: all 0.2s; }
  
  /* CROSS OUT EFFECT */
  .shop-table-row.checked { opacity: 0.4; background: var(--input); }
  .shop-table-row.checked .shop-name { text-decoration: line-through; }

  .shop-check { display: flex; align-items: center; gap: 8px; }
  .shop-check input[type="checkbox"] { appearance: none; width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 4px; cursor: pointer; background: var(--bg); flex-shrink: 0;}
  .shop-check input[type="checkbox"]:checked { background-color: var(--green); border-color: var(--green); }
  .shop-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shop-qty-input { width: 45px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--bg); color: var(--green); font-weight: 800; text-align: center; outline: none; }
  .shop-price-input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--bg); color: var(--text); font-weight: 700; outline: none; }

  /* --- MOBILE RESPONSIVENESS --- */
  @media (max-width: 600px) {
    .table-header { grid-template-columns: 1.5fr 1.5fr 0.5fr 1fr 1fr; padding: 10px 8px; gap: 4px; font-size: 9px;}
    .table-row { grid-template-columns: 1.5fr 1.5fr 0.5fr 1fr 1fr; padding: 10px 8px; gap: 4px; }
    .table-row input[type="text"], .table-row input[type="number"] { padding: 6px; font-size: 12px; }
    .btn-delete-row { height: 28px; font-size: 10px; }
    
    .shop-table-header { grid-template-columns: 2fr 1fr 1fr; padding: 10px 8px; gap: 4px; }
    .shop-table-row { grid-template-columns: 2fr 1fr 1fr; padding: 10px 8px; gap: 4px; }
    .shop-name { font-size: 12px; }
    .shop-qty-input { width: 100%; }
    .shop-price-input { font-size: 12px; padding: 6px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen {% if show_dashboard %}hidden{% endif %}">
  <div class="login-box">
    <div class="logo">⌂</div>
    <h1>MyHousehold</h1>
    <p>Your simple household shopping assistant.</p>
    <form action="/login" method="POST">
      <div class="input-group"><label>Email Address</label><input type="email" name="email" required placeholder="you@example.com"></div>
      <div class="input-group"><label>Password</label><input type="password" name="password" required placeholder="••••••••"></div>
      <button type="submit" class="btn-login">Log in</button>
      <div class="switch">Don't have an account? <a href="/signup_page">Sign up</a></div>
    </form>
  </div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="dashboardScreen" class="screen {% if not show_dashboard %}hidden{% endif %}">
  <header>
    <h2 style="margin:0; font-size:20px;">MyHousehold</h2>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="avatar">{% if email %}{{ email[0]|upper }}{% else %}?{% endif %}</div>
      <a href="/logout" class="logout">Log out</a>
    </div>
  </header>
  <div class="content">
    <div class="menu-panel">
      <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" onclick="filterCategory('Groceries', this)">Groceries</button>
        <button class="tab-btn" onclick="filterCategory('Cleaning supplies', this)">Cleaning Supplies</button>
        <button class="tab-btn" onclick="filterCategory('Personal care', this)">Personal Care</button>
        <button class="tab-btn" onclick="filterCategory('Bathroom & hygiene', this)">Bathroom & Hygiene</button>
      </div>
      
      <div class="action-buttons">
        <button class="btn-action btn-add" onclick="addEmptyRow()">＋ Add</button>
        <button class="btn-action btn-save" onclick="saveList()">Save</button>
        <button class="btn-action btn-generate" onclick="generateShoppingList()">Generate List</button>
        <button class="btn-action btn-visit" onclick="goToShoppingList()">Visit List</button>
      </div>
    </div>
    
    <!-- DASHBOARD TABLE -->
    <div class="table-container">
      <div class="table-header">
        <div>Product</div><div>Description</div><div>Qty</div><div style="text-align:center;">Avail / Not</div><div style="text-align:center;">Delete</div>
      </div>
      <div id="tableBody"></div>
    </div>
  </div>
</div>

<!-- SHOPPING LIST SCREEN -->
<div id="shoppingListScreen" class="screen hidden">
  <header class="shopping-header">
    <button class="btn-back" onclick="closeShoppingList()">← Go Back</button>
    <h2>Your Shopping List</h2>
  </header>
  <div class="content shopping-page-content">
    
    <!-- BUDGET BAR -->
    <div class="budget-bar">
      <div class="budget-input-row">
        <label>My Budget</label>
        <!-- When typing here, it decreases. We save the original input in a hidden variable -->
        <input type="number" id="budgetDisplay" placeholder="0.00" oninput="updateBudgetFromInput(this.value)">
      </div>
      <div class="budget-summary">
        <div class="summary-box" style="width: 100%;">
          <span>Subtotal</span>
          <strong id="subtotalDisplay" class="text-green">M 0.00</strong>
        </div>
      </div>
    </div>

    <!-- SHOPPING TABLE -->
    <div class="shop-table">
      <div class="shop-table-header">
        <div>Item</div><div>Got / Need</div><div>Price (M)</div>
      </div>
      <div id="shoppingListBody"></div>
    </div>
    
  </div>
</div>

<script>
  {% if show_dashboard %}
  let currentCategory = 'Groceries';
  let items = [];
  let generatedList = [];
  let originalBudget = 0; // Keeps track of the starting budget

  async function loadItems() {
    const res = await fetch('/api/items');
    items = await res.json();
    renderTable();
  }

  function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const filtered = items.filter(i => i.category === currentCategory);
    if (filtered.length === 0) {
      tbody.innerHTML = `<div style="padding: 40px; text-align: center; color: #88a692; font-size:14px;">No items yet.<br>Tap "+ Add" to start.</div>`;
      return;
    }
    tbody.innerHTML = filtered.map(item => `
      <div class="table-row">
        <input type="text" value="${item.name || ''}" placeholder="Product" onchange="updateItem(${item.id}, 'name', this.value)">
        <input type="text" value="${item.description || ''}" placeholder="Desc" onchange="updateItem(${item.id}, 'description', this.value)">
        <input type="number" value="${item.quantity}" min="1" onchange="updateItem(${item.id}, 'quantity', this.value)">
        <div class="radio-group">
          <label><input type="radio" name="avail_${item.id}" ${item.available ? 'checked' : ''} onchange="updateItem(${item.id}, 'available', true)"> Avail</label>
          <label><input type="radio" name="avail_${item.id}" ${!item.available ? 'checked' : ''} onchange="updateItem(${item.id}, 'available', false)"> Not</label>
        </div>
        <button class="btn-delete-row" onclick="deleteRow(${item.id})">Delete</button>
      </div>
    `).join('');
  }

  function updateItem(id, field, val) {
    const item = items.find(i => i.id === id);
    if (item) {
      if (field === 'quantity') val = Math.max(1, parseInt(val) || 1);
      item[field] = val;
    }
  }

  function deleteRow(id) {
    if(confirm('Delete this product?')) {
      items = items.filter(i => i.id !== id);
      renderTable();
    }
  }

  function addEmptyRow() {
    items.unshift({ id: Date.now(), name: '', description: '', quantity: 1, available: true, category: currentCategory });
    renderTable();
  }

  async function saveList() {
    await fetch('/api/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items)
    });
    alert("List saved to your account!");
    loadItems();
  }

  function generateShoppingList() {
    const needed = items.filter(i => !i.available && i.name.trim() !== '');
    generatedList = needed.map(i => ({ ...i, gotQty: i.quantity, actualPrice: '' }));
    if(needed.length === 0) {
       alert("No items marked as 'Not' to generate a list.");
       return;
    }
    alert("Shopping list generated with " + needed.length + " items!");
  }

  function goToShoppingList() {
    const body = document.getElementById('shoppingListBody');
    if (generatedList.length === 0) {
      body.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--muted); font-size:14px;">No items generated.<br>Click "Generate List" first.</div>`;
    } else {
      body.innerHTML = generatedList.map(i => `
        <div class="shop-table-row" id="shop-item-${i.id}">
          <div class="shop-check">
            <input type="checkbox" ${i.gotQty >= i.quantity ? 'checked' : ''} onchange="toggleCheck(${i.id}, this)">
            <div class="shop-name">${i.name}</div>
          </div>
          <div style="display:flex; align-items:center; gap:4px;">
            <input type="number" class="shop-qty-input" value="${i.gotQty}" min="0" max="${i.quantity}" oninput="updateGotQty(${i.id}, this.value)">
            <span style="font-size:11px; color:var(--muted);">/ ${i.quantity}</span>
          </div>
          <div>
            <input type="number" class="shop-price-input" placeholder="0.00" value="${i.actualPrice || ''}" oninput="updatePrice(${i.id}, this.value)">
          </div>
        </div>
      `).join('');
      
      // Reset original budget when entering the page
      originalBudget = parseFloat(document.getElementById('budgetDisplay').value) || 0;
      calcBudget();
    }
    document.getElementById('dashboardScreen').classList.add('hidden');
    document.getElementById('shoppingListScreen').classList.remove('hidden');
  }

  function closeShoppingList() {
    document.getElementById('shoppingListScreen').classList.add('hidden');
    document.getElementById('dashboardScreen').classList.remove('hidden');
  }

  // When the user manually types a new starting budget
  function updateBudgetFromInput(val) {
    originalBudget = parseFloat(val) || 0;
    calcBudget();
  }

  function updateGotQty(id, val) {
    const i = generatedList.find(x => x.id === id);
    if (!i) return;
    let n = parseInt(val) || 0;
    if (n > i.quantity) n = i.quantity;
    if (n < 0) n = 0;
    i.gotQty = n;
    
    // Cross out logic
    const card = document.getElementById(`shop-item-${id}`);
    if (card) card.classList.toggle('checked', i.gotQty >= i.quantity);
    
    calcBudget();
  }

  function toggleCheck(id, cb) {
    const i = generatedList.find(x => x.id === id);
    i.gotQty = cb.checked ? i.quantity : 0;
    const input = document.querySelector(`input[oninput="updateGotQty(${id}, this.value)"]`);
    if (input) input.value = i.gotQty;
    
    // Cross out logic
    const card = document.getElementById(`shop-item-${id}`);
    if (card) card.classList.toggle('checked', cb.checked);
    
    calcBudget();
  }

  function updatePrice(id, val) {
    const i = generatedList.find(x => x.id === id);
    if (i) { i.actualPrice = val; calcBudget(); }
  }

  // Calculates subtotal and decreases the budget box
  function calcBudget() {
    let tot = 0;
    generatedList.forEach(i => {
      if (i.actualPrice && !isNaN(i.actualPrice)) tot += parseFloat(i.actualPrice) * i.gotQty;
    });
    
    // Show Subtotal
    document.getElementById('subtotalDisplay').textContent = `M ${tot.toFixed(2)}`;
    
    // Calculate new budget and update the input box
    const newBudget = originalBudget - tot;
    const budgetDisplay = document.getElementById('budgetDisplay');
    budgetDisplay.value = newBudget.toFixed(2);

    // Change color to red if over budget
    if (newBudget < 0) {
        budgetDisplay.classList.add('text-red');
        budgetDisplay.classList.remove('text-green');
    } else {
        budgetDisplay.classList.remove('text-red');
        budgetDisplay.classList.add('text-green');
    }
  }

  loadItems();
  {% endif %}
</script>
</body>
</html>
